
name: Generate CyberGuard AI Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'CyberGuard_AI/assets/generate_assets.py'
      - '.github/workflows/generate-cyberguard-assets.yml'

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate CyberGuard AI images
        run: python CyberGuard_AI/assets/generate_assets.py

      - name: Upload generated images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CyberGuard_AI/assets/logo.png CyberGuard_AI/assets/background.png
          git diff --cached --quiet || git commit -m "Generate CyberGuard AI logo and background"
          git push
